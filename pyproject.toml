[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "room-rank-features"
version = "4.3.1"
description = "Eight pandas room-ranking configurations with point-in-time bed preferences"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<3",
    "scipy>=1.10,<2",
    "scikit-learn>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
room_rank_features = ["data/*.json"]
